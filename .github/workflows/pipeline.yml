name: Update projections

on:
  schedule:
    - cron: "15 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch: {}       # "Run workflow" button for manual refreshes

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4          # past seasons rarely change; keep them between runs
        with:
          path: .cache/history
          key: fpl-history-v1
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_MOCK: ${{ vars.FPL_MOCK }}
          TRACK_TEAM_IDS: ${{ vars.TRACK_TEAM_IDS }}
